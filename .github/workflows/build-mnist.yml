name: Build & Push MNIST Training Image

on:
  push:
    paths:
      - "training/mnist/**"
      - ".github/workflows/build-mnist.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/shubham-rasal/skyscale-mnist

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: training/mnist
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v1
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
