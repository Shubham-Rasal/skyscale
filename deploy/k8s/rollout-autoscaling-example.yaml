# Requires Prometheus Adapter (or another custom.metrics.k8s.io provider).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: run-example-rollout
  namespace: skyscale-tenant-example-project-example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: run-example-rollout
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: skyscale_rollout_queue_depth
        target:
          type: AverageValue
          averageValue: "4"
    - type: Pods
      pods:
        metric:
          name: skyscale_rollout_generation_latency_seconds
        target:
          type: AverageValue
          averageValue: "10"
