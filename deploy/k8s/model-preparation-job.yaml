apiVersion: batch/v1
kind: Job
metadata:
  name: prepare-qwen3-0-6b
  namespace: skyscale-tenant-example-project-example
  labels:
    app.kubernetes.io/part-of: skyscale-rl
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: skyscale-rl
        rl.skyscale.dev/role: model-preparation
    spec:
      restartPolicy: Never
      serviceAccountName: skyscale-rl-runner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare
          image: ghcr.io/skyscale/slime-runtime@sha256:REPLACE_WITH_BUILT_DIGEST
          args:
            - python
            - /opt/skyscale/slime/prepare_model.py
            - --model
            - Qwen/Qwen3-0.6B
            - --revision
            - REPLACE_WITH_IMMUTABLE_HF_REVISION
            - --output-root
            - /models
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: model-registry
                  key: hf-token
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen3-0-6b-models
