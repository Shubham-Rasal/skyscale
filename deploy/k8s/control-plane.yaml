apiVersion: v1
kind: ServiceAccount
metadata:
  name: skyscale-control-plane
  namespace: skyscale-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skyscale-rl-controller
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayjobs/status"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims", "namespaces", "resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skyscale-rl-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skyscale-rl-controller
subjects:
  - kind: ServiceAccount
    name: skyscale-control-plane
    namespace: skyscale-system
---
apiVersion: v1
kind: Service
metadata:
  name: skyscale-control-plane
  namespace: skyscale-system
spec:
  selector:
    app.kubernetes.io/name: skyscale-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyscale-control-plane
  namespace: skyscale-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skyscale-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyscale-control-plane
    spec:
      serviceAccountName: skyscale-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          # Replace with the immutable digest produced by your release pipeline.
          image: ghcr.io/skyscale/control-plane@sha256:REPLACE_ME
          env:
            - name: SKYSCALE_RL_KUBERNETES
              value: "1"
            - name: SKYSCALE_RL_TENANT_MAX_RUNS
              value: "2"
            - name: SKYSCALE_RL_TENANT_MAX_GPUS
              value: "8"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skyscale-control-plane
                  key: database-url
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: skyscale-control-plane
                  key: s3-endpoint
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
